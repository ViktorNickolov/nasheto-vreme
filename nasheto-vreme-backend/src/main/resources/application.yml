spring:
  application:
    name: nasheto-vreme-backend
  profiles:
    active: local
  mail:
#    host: ${APP_MAIL_HOST:smtp-relay.brevo.com}
    host: ${APP_MAIL_HOST:}
#    port: ${APP_MAIL_PORT:587}
    port: ${APP_MAIL_PORT:}
    username: ${APP_MAIL_USERNAME:apikey}
#    password: ${APP_MAIL_PASSWORD:your-brevo-smtp-key}
    password: ${APP_MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${APP_MAIL_SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${APP_MAIL_SMTP_STARTTLS:true}

server:
  port: 8088

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  cors:
    allowed-origins: ${APP_CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  auth:
    refresh-cookie:
      name: ${APP_REFRESH_COOKIE_NAME:nv_refresh_token}
      path: ${APP_REFRESH_COOKIE_PATH:/}
      same-site: ${APP_REFRESH_COOKIE_SAME_SITE:Lax}
      secure: ${APP_REFRESH_COOKIE_SECURE:false}
  upload:
    max-file-size-bytes: ${APP_UPLOAD_MAX_FILE_SIZE_BYTES:5242880}
  invites:
    enabled: ${APP_INVITES_ENABLED:true}
    expires-in-hours: ${APP_INVITES_EXPIRES_IN_HOURS:72}
    sender-email: ${APP_INVITES_SENDER_EMAIL:viktor.nickolov@gmail.com}
    sender-name: ${APP_INVITES_SENDER_NAME:Nasheto Vreme}
    accept-url-template: ${APP_INVITES_ACCEPT_URL_TEMPLATE:http://localhost:5173/?inviteToken={token}&inviteEmail={email}}

logging:
  level:
    root: INFO
    org.springframework: INFO
    com.nashetovreme: DEBUG
