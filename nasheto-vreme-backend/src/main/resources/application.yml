spring:
  application:
    name: nasheto-vreme-backend
  profiles:
    active: local

server:
  port: 8088

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  cors:
    allowed-origins: ${APP_CORS_ORIGINS:http://localhost:5173}
  auth:
    refresh-cookie:
      name: ${APP_REFRESH_COOKIE_NAME:nv_refresh_token}
      path: ${APP_REFRESH_COOKIE_PATH:/}
      same-site: ${APP_REFRESH_COOKIE_SAME_SITE:Lax}
      secure: ${APP_REFRESH_COOKIE_SECURE:false}
  upload:
    max-file-size-bytes: ${APP_UPLOAD_MAX_FILE_SIZE_BYTES:5242880}

logging:
  level:
    root: INFO
    org.springframework: INFO
    com.nashetovreme: DEBUG
