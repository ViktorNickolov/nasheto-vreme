spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://postgres:5432/nasheto_vreme}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    show-sql: false
  flyway:
    enabled: true
  mail:
    host: ${APP_MAIL_HOST}
    port: ${APP_MAIL_PORT:587}
    username: ${APP_MAIL_USERNAME}
    password: ${APP_MAIL_PASSWORD}
    properties:
      mail.smtp.auth: ${APP_MAIL_SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${APP_MAIL_SMTP_STARTTLS:true}

app:
  jwt:
    secret: ${APP_JWT_SECRET}
    access-token-ttl: ${APP_JWT_ACCESS_TOKEN_TTL:15m}
    refresh-token-ttl: ${APP_JWT_REFRESH_TOKEN_TTL:7d}
  cors:
    allowed-origins: ${APP_CORS_ORIGINS}
  auth:
    refresh-cookie:
      name: ${APP_REFRESH_COOKIE_NAME:nv_refresh_token}
      path: ${APP_REFRESH_COOKIE_PATH:/}
      same-site: ${APP_REFRESH_COOKIE_SAME_SITE:Lax}
      secure: ${APP_REFRESH_COOKIE_SECURE:true}
  upload:
    base-dir: ${APP_UPLOAD_BASE_DIR:uploads/images}
    max-file-size-bytes: ${APP_UPLOAD_MAX_FILE_SIZE_BYTES:5242880}
  invites:
    enabled: ${APP_INVITES_ENABLED:false}
    expires-in-hours: ${APP_INVITES_EXPIRES_IN_HOURS:72}
    sender-email: ${APP_INVITES_SENDER_EMAIL}
    sender-name: ${APP_INVITES_SENDER_NAME:Nasheto Vreme}
    accept-url-template: ${APP_INVITES_ACCEPT_URL_TEMPLATE}

logging:
  level:
    com.nashetovreme: INFO

