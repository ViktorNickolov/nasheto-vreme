services:
  postgres:
    image: postgres:17
    container_name: nv-postgres
    environment:
      POSTGRES_DB: nasheto_vreme
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nasheto_vreme"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./nasheto-vreme-backend
      dockerfile: Dockerfile
    container_name: nv-backend
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/nasheto_vreme
      DB_USER: postgres
      DB_PASSWORD: postgres
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8088:8088"
    restart: unless-stopped

  frontend:
    build:
      context: ./nasheto-vreme-frontend
      dockerfile: Dockerfile
    container_name: nv-frontend
    depends_on:
      - backend
    ports:
      - "5173:80"
    restart: unless-stopped

volumes:
  postgres-data:

